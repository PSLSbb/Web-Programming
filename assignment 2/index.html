<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IE0hB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</head>

<body>
    <div>
        <div class="row">
            <div class="bg-dark" style="height: 235px;">
                <div class="card-body pt-4" style="padding-left: 96px; margin: 0px 17px;">
                    <p class="workshop-pill" style="background-color: rgb(255, 196, 15); display: inline-block; padding: 2px 8px; border-radius: 9px; font-size: 12px; font-weight: 700;"> Free workshop</p>
                    <h1 class="card-title" style="color: #fff; font-weight: 700; font-size: 47px; width: 900px; margin-bottom: 9px;">Web Design Workshop</h1>
                    <p class="card-text" style="color: #fff; font-size: 20px; font-weight: 100;">Build your first responsive webpage with HTML and Bootstrap.</p>
                </div>
            </div>
        </div>
        <div class="row py-4" style="margin: 0px 96px;">
            <div class="col-sm-5 mb-3 mb-sm-0" style="padding-top: 13px;">
                <div class="card">
                    <div class="card-body p-4">
                        <h4 class="card-title" style="margin-bottom: 15px;">Workshop details</h4>
                        <div class="workshop-details">
                            <p style="font-weight: 700; display: inline;">Day</p>
                            <p>Saturday</p>
                        </div>
                        <div class="workshop-details">
                            <p style="font-weight: 700; display: inline;">Location</p>
                            <p>School computer lab</p>
                        </div>
                        <div class="workshop-details">
                            <p style="font-weight: 700; margin: 0;">What to bring</p>
                            <p style="margin: 0;">A laptop and charger</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-7" style="padding-top: 13px;">
                <div class="card">
                    <div class="card-body p-4">
                        <h4 class="card-title" style="margin-bottom: 15px;">Register for a session</h4>
                        <form>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full name</label>
                                <input type="password" class="form-control" id="fullName">
                            </div>
                            <div class="mb-3">
                                <label for="emailAddress" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="emailAddress" aria-describedby="emailHelp">
                            </div>
                            <legend class="fs-6" style="font-weight: 500;">Choose a session</legend>
                            <div style="margin-bottom: 23px;">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="radioDefault" id="morningSession">
                                    <label class="form-check-label" for="morningSession">Morning · 9:00–11:00 AM</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="radioDefault" id="afternoonSession">
                                    <label class="form-check-label" for="afternoonSession">Afternoon · 2:00–4:00 PM</label>
                                </div>
                            </div>
                            <button class="btn btn-primary px-4">Register</button>
                            <p class="form-text mt-3 mb-0">Practice form. Entries are discarded.</p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
